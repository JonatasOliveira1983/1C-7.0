<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>1Crypten 7.0 — Hermes</title>
  <link rel="stylesheet" href="/static/css/lamborghini.css">
  <link rel="stylesheet" href="/static/css/hallmark_console.css">
  <script src="/static/js/thinking_orbs.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #080A0F;
      color: #F1F5F9;
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    /* Container ocupa exatamente a altura total menos o header institucional de 40px */
    .hermes-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 40px);
      height: calc(100dvh - 40px);
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 12px 10px 12px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .chat-card {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #0B0E14;
      border: 1px solid #1D2330;
      border-radius: 6px;
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
    }

    /* Área central de mensagens */
    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    /* Hero central: Orb maior centralizado na tela com o nome Hermes */
    .hermes-hero {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 30px 10px;
      text-align: center;
      user-select: none;
      transition: all 0.25s ease-out;
    }

    .hermes-hero-title {
      font-family: var(--font-sans, sans-serif);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #F1F5F9;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(252, 213, 53, 0.15);
    }

    /* Quando há mensagens na tela, o hero passa a ocupar o topo de forma sutil */
    .hermes-hero.has-messages {
      margin: 0 auto 12px auto;
      padding: 6px 0;
      gap: 8px;
    }

    .hermes-hero.has-messages .hermes-hero-title {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #94A3B8;
    }

    /* Balões de mensagem */
    .chat-bubble {
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      max-width: 86%;
      border-radius: 4px;
      word-break: break-word;
      overflow-wrap: break-word;
      font-family: var(--font-sans, sans-serif);
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-bubble-user {
      background-color: #161C26;
      color: #F1F5F9;
      margin-left: auto;
      border: 1px solid #283244;
    }

    .chat-bubble-hermes {
      background-color: #0E121A;
      color: #CBD5E1;
      margin-right: auto;
      border: 1px solid #1D2330;
      border-left: 3px solid #FCD535;
    }

    .bubble-role {
      font-family: var(--font-mono, monospace);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .bubble-content {
      white-space: pre-wrap;
    }

    /* Barra de digitação colada na base sem espaço morto */
    .chat-input-bar {
      height: 52px;
      min-height: 52px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 12px;
      background: #0E121A;
      border-top: 1px solid #1D2330;
      box-sizing: border-box;
      width: 100%;
      flex-shrink: 0;
    }

    .chat-input-field {
      flex: 1;
      min-width: 0;
      padding: 0 12px;
      font-size: 13px;
      height: 38px;
      background: #080A0F;
      border: 1px solid #1D2330;
      border-radius: 4px;
      color: #F1F5F9;
      font-family: var(--font-sans, sans-serif);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .chat-input-field:focus {
      border-color: #FCD535;
    }

    .chat-send-btn {
      flex-shrink: 0;
      padding: 0 18px;
      height: 38px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      border-radius: 4px;
      border: none;
      background: #FCD535;
      color: #080A0F;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .chat-send-btn:hover {
      background: #e5c12f;
    }

    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .hermes-container {
        padding: 4px 6px 6px 6px;
      }
      .chat-messages {
        padding: 12px 8px;
        gap: 10px;
      }
      .chat-bubble {
        max-width: 94%;
        padding: 10px 12px;
        font-size: 12.5px;
      }
      .hermes-hero-title {
        font-size: 19px;
      }
      .chat-input-bar {
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>

  <main class="hermes-container">
    <div class="chat-card">

      <!-- Área de Mensagens com o Hero Centralizado no Início -->
      <div id="chat-messages" class="chat-messages">
        <div id="hermes-hero" class="hermes-hero">
          <canvas id="hermes-main-orb" class="thinking-orb" data-state="solving" data-size="76" data-color="#FCD535" width="76" height="76" style="width:76px;height:76px;"></canvas>
          <div class="hermes-hero-title">HERMES</div>
        </div>
      </div>

      <!-- Barra de Input (colada ao fundo) -->
      <div class="chat-input-bar">
        <input id="chat-input" class="chat-input-field" type="text" placeholder="Comando para o Hermes..." onkeydown="if(event.key==='Enter') sendMessage()" autofocus autocomplete="off">
        <button id="chat-btn-send" onclick="sendMessage()" class="chat-send-btn">ENVIAR</button>
      </div>

    </div>
  </main>

  <script src="/static/shell.js"></script>
  <script>
    mountLamborghiniShell('hermes');

    if (typeof initThinkingOrbs === 'function') {
      try {
        initThinkingOrbs();
      } catch (e) {
        console.warn('initThinkingOrbs aviso:', e);
      }
    }

    function appendMessage(role, text) {
      const container = document.getElementById("chat-messages");
      const hero = document.getElementById("hermes-hero");
      
      if (hero && !hero.classList.contains("has-messages")) {
        hero.classList.add("has-messages");
        const orbCanvas = document.getElementById("hermes-main-orb");
        if (orbCanvas && window.ThinkingOrbsManager) {
          try {
            orbCanvas.style.width = "40px";
            orbCanvas.style.height = "40px";
            window.ThinkingOrbsManager.update(orbCanvas, { size: 40 });
          } catch (e) {}
        }
      }

      const bubble = document.createElement("div");
      bubble.className = `chat-bubble chat-bubble-${role === 'user' ? 'user' : 'hermes'}`;
      
      const roleLabel = role === 'user' ? 'OPERADOR' : 'HERMES';
      const roleColor = role === 'user' ? '#94A3B8' : '#FCD535';

      bubble.innerHTML = `
        <div class="bubble-role" style="color: ${roleColor};">${roleLabel}</div>
        <div class="bubble-content">${escapeHtml(text)}</div>
      `;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML.replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const btn = document.getElementById("chat-btn-send");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      btn.disabled = true;

      appendMessage("user", text);

      try {
        const res = await fetch("/api/v1/hermes/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: "default" })
        });
        if (res.ok) {
          const data = await res.json();
          appendMessage("hermes", data.reply || data.response || "Comando processado.");
        } else {
          const res2 = await fetch("/api/hermes/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });
          if (res2.ok) {
            const data2 = await res2.json();
            appendMessage("hermes", data2.reply || data2.response || "Processado.");
          } else {
            appendMessage("hermes", "Não foi possível obter resposta do Hermes no momento.");
          }
        }
      } catch (err) {
        appendMessage("hermes", "Falha de comunicação de rede com o orquestrador.");
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>1Crypten 7.0 — Hermes</title>
  <link rel="stylesheet" href="/static/css/lamborghini.css">
  <link rel="stylesheet" href="/static/css/hallmark_console.css">
  <script src="/static/js/thinking_orbs.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #080A0F;
      color: #F1F5F9;
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    /* Container ocupa exatamente a altura total menos a barra superior de 40px */
    .hermes-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 40px);
      height: calc(100dvh - 40px);
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 12px 10px 12px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .chat-card {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #0B0E14;
      border: 1px solid #1D2330;
      border-radius: 6px;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Cabeçalho minimalista: apenas o Orb e o nome HERMES */
    .chat-header {
      height: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      background: #0E121A;
      border-bottom: 1px solid #1D2330;
      flex-shrink: 0;
    }

    .chat-header-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #F1F5F9;
      text-transform: uppercase;
      font-family: var(--font-sans, sans-serif);
    }

    /* Área de mensagens que rola livremente */
    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble {
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      max-width: 88%;
      border-radius: 4px;
      word-break: break-word;
      overflow-wrap: break-word;
      font-family: var(--font-sans, sans-serif);
    }

    .chat-bubble-user {
      background-color: #161C26;
      color: #F1F5F9;
      margin-left: auto;
      border: 1px solid #283244;
    }

    .chat-bubble-hermes {
      background-color: #0E121A;
      color: #CBD5E1;
      margin-right: auto;
      border: 1px solid #1D2330;
      border-left: 3px solid #FCD535;
    }

    .bubble-role {
      font-family: var(--font-mono, monospace);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .bubble-content {
      white-space: pre-wrap;
    }

    /* Barra de digitação colada no fundo sem espaço vazio */
    .chat-input-bar {
      height: 52px;
      min-height: 52px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 12px;
      background: #0E121A;
      border-top: 1px solid #1D2330;
      box-sizing: border-box;
      width: 100%;
      flex-shrink: 0;
    }

    .chat-input-field {
      flex: 1;
      min-width: 0;
      padding: 0 12px;
      font-size: 13px;
      height: 38px;
      background: #080A0F;
      border: 1px solid #1D2330;
      border-radius: 4px;
      color: #F1F5F9;
      font-family: var(--font-sans, sans-serif);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .chat-input-field:focus {
      border-color: #FCD535;
    }

    .chat-send-btn {
      flex-shrink: 0;
      padding: 0 18px;
      height: 38px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      border-radius: 4px;
      border: none;
      background: #FCD535;
      color: #080A0F;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .chat-send-btn:hover {
      background: #e5c12f;
    }

    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .hermes-container {
        padding: 4px 6px 6px 6px;
      }
      .chat-header {
        height: 40px;
        min-height: 40px;
        padding: 0 12px;
      }
      .chat-messages {
        padding: 10px 10px;
        gap: 10px;
      }
      .chat-bubble {
        max-width: 94%;
        padding: 10px 12px;
        font-size: 12.5px;
      }
      .chat-input-bar {
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>

  <main class="hermes-container">
    <div class="chat-card">

      <!-- Cabeçalho Único: Orb + HERMES -->
      <header class="chat-header">
        <canvas class="thinking-orb-canvas" data-state="solving" data-size="22" data-color="#FCD535" width="22" height="22" style="width:22px;height:22px;"></canvas>
        <span class="chat-header-title">HERMES</span>
      </header>

      <!-- Mensagens da Sessão -->
      <div id="chat-messages" class="chat-messages">
        <div class="chat-bubble chat-bubble-hermes">
          <div class="bubble-role" style="color: #FCD535;">HERMES ONLINE</div>
          <div class="bubble-content">Mesa de operações 1Crypten sincronizada. Como posso auxiliar na estratégia ou consulta do sistema agora?</div>
        </div>
      </div>

      <!-- Barra de Input (sem folga inferior) -->
      <div class="chat-input-bar">
        <input id="chat-input" class="chat-input-field" type="text" placeholder="Comando para o Hermes..." onkeydown="if(event.key==='Enter') sendMessage()" autofocus autocomplete="off">
        <button id="chat-btn-send" onclick="sendMessage()" class="chat-send-btn">ENVIAR</button>
      </div>

    </div>
  </main>

  <script src="/static/shell.js"></script>
  <script>
    mountLamborghiniShell('hermes');

    if (typeof initThinkingOrbs === 'function') {
      try {
        initThinkingOrbs();
      } catch (e) {
        console.warn('initThinkingOrbs aviso:', e);
      }
    }

    function appendMessage(role, text) {
      const container = document.getElementById("chat-messages");
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble chat-bubble-${role === 'user' ? 'user' : 'hermes'}`;
      
      const roleLabel = role === 'user' ? 'OPERADOR' : 'HERMES INTEL';
      const roleColor = role === 'user' ? '#94A3B8' : '#FCD535';

      bubble.innerHTML = `
        <div class="bubble-role" style="color: ${roleColor};">${roleLabel}</div>
        <div class="bubble-content">${escapeHtml(text)}</div>
      `;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML.replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const btn = document.getElementById("chat-btn-send");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      btn.disabled = true;

      appendMessage("user", text);

      try {
        const res = await fetch("/api/v1/hermes/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: "default" })
        });
        if (res.ok) {
          const data = await res.json();
          appendMessage("hermes", data.reply || data.response || "Comando processado.");
        } else {
          // Fallback para rota secundária se existir
          const res2 = await fetch("/api/hermes/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });
          if (res2.ok) {
            const data2 = await res2.json();
            appendMessage("hermes", data2.reply || data2.response || "Processado.");
          } else {
            appendMessage("hermes", "Não foi possível obter resposta do Hermes no momento.");
          }
        }
      } catch (err) {
        appendMessage("hermes", "Falha de comunicação de rede com o orquestrador.");
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
